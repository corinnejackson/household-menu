<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e07a5f" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sign in · Family Meal Planner</title>
  <link rel="icon" href="/pwa/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
  <link rel="manifest" href="/pwa/manifest.webmanifest" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #292524;
      background: radial-gradient(circle at 20% 10%, #fdf8f6 0, transparent 45%),
                  radial-gradient(circle at 80% 90%, #e3eae3 0, transparent 45%),
                  #f5f5f4;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid #e7e5e4;
      border-radius: 24px;
      padding: 32px 28px 28px;
      box-shadow: 0 10px 30px -12px rgba(41, 37, 36, 0.18);
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: block;
      margin: 0 auto 16px;
    }
    h1 { font-size: 20px; margin: 0; text-align: center; font-weight: 800; }
    .sub { margin: 6px 0 24px; text-align: center; font-size: 13px; color: #78716c; }
    label { display: block; font-size: 12px; font-weight: 700; color: #44403c; margin-bottom: 6px; }
    .field { position: relative; }
    input[type="password"], input[type="text"] {
      width: 100%;
      font-size: 16px;
      padding: 12px 64px 12px 14px;
      border: 1px solid #d6d3d1;
      border-radius: 12px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: #e07a5f; box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.2); }
    .toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: none;
      font-size: 12px;
      font-weight: 700;
      color: #78716c;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
    }
    .toggle:hover { color: #292524; background: #f5f5f4; }
    button[type="submit"] {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: #e07a5f;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      transition: background .15s;
    }
    button[type="submit"]:hover { background: #d06448; }
    button[type="submit"]:disabled { opacity: .7; cursor: default; }
    .error {
      margin: 0 0 16px;
      padding: 10px 12px;
      font-size: 13px;
      color: #9f1239;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 10px;
    }
    .hint { margin-top: 18px; text-align: center; font-size: 11px; color: #a8a29e; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/pwa/icon.svg" alt="" />
    <h1>Family Meal Planner</h1>
    <p class="sub">Enter the household password to continue</p>
    {{ERROR}}
    <form method="post" action="/login" id="login-form">
      <!-- Lets phone password managers save this login under a name -->
      <input type="text" name="username" value="family" autocomplete="username" hidden />
      <label for="password">Password</label>
      <div class="field">
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button type="button" class="toggle" id="toggle-btn" aria-label="Show password">Show</button>
      </div>
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
    <p class="hint">You'll stay signed in on this device.</p>
  </main>
  <script>
    const input = document.getElementById('password');
    const toggle = document.getElementById('toggle-btn');
    toggle.addEventListener('click', () => {
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      toggle.textContent = show ? 'Hide' : 'Show';
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      input.focus();
    });
    document.getElementById('login-form').addEventListener('submit', () => {
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
    });
  </script>
</body>
</html>
